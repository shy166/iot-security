<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>
    text { font-family: 'Iosevka', monospace; text-anchor: middle; dominant-baseline: middle; }
    .link { stroke: #6c7086; stroke-width: 2; stroke-dasharray: 6 6; }
    .node { fill: #000000; stroke: #6c7086; stroke-width: 2; }
    .label { fill: #cdd6f4; font-size: 18px; }
    .gw { fill: #000000; stroke: #cdd6f4; stroke-width: 2; }
    .gwtext { fill: #cdd6f4; font-size: 15px; }
    .cloud { fill: #000000; stroke: #cdd6f4; stroke-width: 2.5; }
    .iot { fill: #ff0000; font-size: 34px; font-weight: bold; }
  </style>

  <line class="link" x1="130" y1="70"  x2="400" y2="240" />
  <line class="link" x1="400" y1="50"  x2="400" y2="240" />
  <line class="link" x1="670" y1="70"  x2="400" y2="240" />
  <line class="link" x1="110" y1="250" x2="400" y2="240" />
  <line class="link" x1="690" y1="250" x2="400" y2="240" />

  <rect class="gw" x="240" y="142" width="50" height="26" rx="4" />
  <text class="gwtext" x="265" y="155">gw</text>

  <rect class="gw" x="215" y="233" width="50" height="26" rx="4" />
  <text class="gwtext" x="240" y="246">gw</text>


  <path class="cloud" d="M325 285 A35 35 0 0 1 335 220 A50 50 0 0 1 425 205 A40 40 0 0 1 480 240 A25 25 0 0 1 475 285 Z" />
  <text class="iot" x="405" y="252">IoT</text>

  <rect class="node" x="55" y="47" width="150" height="46" rx="6" />
