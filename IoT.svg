  <rect class="node" x="325" y="27" width="150" height="46" rx="6" />
  <text class="label" x="400" y="50">lightbulb</text>

  <rect class="node" x="35" y="227" width="150" height="46" rx="6" />
  <text class="label" x="110" y="250">cameras</text>

  <rect class="node" x="595" y="47" width="150" height="46" rx="6" />
  <text class="label" x="670" y="70">cloud server</text>

  <rect class="node" x="615" y="227" width="150" height="46" rx="6" />
  <text class="label" x="690" y="250">mobile app</text>

</svg>
